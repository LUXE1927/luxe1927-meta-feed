
name: Test MXSB2 API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests beautifulsoup4

      - name: Test API
       run: LUXE_TEST_DISCOVERY=1 python build_feed_api_candidate_fixed.py
