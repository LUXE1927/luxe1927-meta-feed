
name: Test LUXE1927 Products

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Test product data
        run: python build_feed.py

      - name: Upload Meta Product Feed
        uses: actions/upload-artifact@v4
        with:
          name: luxe1927-meta-feed
          path: products.csv
          if-no-files-found: error
